<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>البطاقة الرقمية</title>
  <meta property="og:title" content="البطاقة الرقمية">
  <meta property="og:image" content="logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --page-bg: #dedede;
      --line: #d4d4d4;
      --blue: #6096e8;
      --blue-deep: #3780e8;
      --nav-blue: #565656;
      --danger: #d60000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Cairo", sans-serif;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      background: var(--page-bg);
      color: #171717;
    }

    button {
      font: inherit;
      cursor: default;
    }

    .mobile-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--page-bg);
      overflow: hidden;
    }

    .top-bar {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 15px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .sys-logo-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .top-icons {
      display: flex;
      align-items: center;
      gap: 9px;
      direction: ltr;
    }

    .icon-circle {
      width: 37px;
      height: 37px;
      position: relative;
      display: grid;
      place-items: center;
      color: #050505;
      background: #e5e6e8;
      border: 0;
      border-radius: 50%;
      font-size: 18px;
    }

    .notification-badge {
      position: absolute;
      top: -6px;
      right: -8px;
      min-width: 24px;
      height: 24px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
      border-radius: 999px;
      color: #fff;
      background: #f02f2f;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }

    .download-banner {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 16px;
      color: #1f1f1f;
      background: #dedede;
      border-bottom: 1px solid #c7c7c7;
    }

    .download-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 600;
      white-space: nowrap;
    }

    .download-text i {
      color: #5d5d5d;
      font-size: 20px;
    }

    .download-btn {
      min-width: 78px;
      border: 0;
      border-radius: 999px;
      padding: 6px 15px;
      color: #fff;
      background: #000;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .card-area {
      flex: 1;
      padding: 12px 11px 16px;
      display: flex;
      flex-direction: column;
    }

    .full-card-container {
      overflow: hidden;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .id-card {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: var(--blue);
      padding-bottom: 15px;
    }

    .card-header-section {
      min-height: 51px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
      background: var(--blue-deep);
    }

    .card-header-logo {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      object-fit: cover;
      background: #fff;
      border: 2px solid #fff;
      border-radius: 50%;
    }

    .card-header-text {
      min-width: 0;
      overflow: hidden;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .student-info {
      min-height: 143px;
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr);
      align-items: start;
      gap: 13px;
      padding: 15px 14px 9px;
    }

    .student-photo-container {
      width: 80px;
      text-align: center;
    }

    .student-photo {
      width: 80px;
      height: 105px;
      display: block;
      object-fit: cover;
      object-position: center top;
      background: #f6f6f6;
    }

    .academic-year {
      margin-top: 1px;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
      white-space: nowrap;
    }

    .text-info {
      min-width: 0;
      padding-top: 2px;
      text-align: right;
    }

    .student-name {
      margin-bottom: 6px;
      font-size: clamp(20px, 6vw, 25px);
      font-weight: 800;
      line-height: 1.3;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.08);
    }

    .student-details {
      font-size: clamp(14px, 4.3vw, 17px);
      font-weight: 600;
      line-height: 1.7;
      opacity: 0.97;
    }

    .numbers-section {
      min-height: 181px;
      padding: 43px 16px 7px;
      text-align: center;
    }

    .id-number,
    .live-date,
    .live-time {
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: 0;
      direction: ltr;
    }

    .id-number {
      margin-bottom: 12px;
      font-size: clamp(25px, 7vw, 33px);
    }

    .live-date {
      margin-bottom: 12px;
      font-size: clamp(25px, 7vw, 33px);
    }

    .live-time {
      font-size: clamp(28px, 8vw, 38px);
    }

    .card-footer-section {
      height: 31px;
      background: var(--blue-deep);
    }

    .bottom-nav {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 5px 13px;
      background: #fff;
      border-top: 1px solid var(--line);
    }

    .nav-item {
      width: 54px;
      height: 52px;
      display: grid;
      place-items: center;
      border: 0;
      color: var(--nav-blue);
      background: transparent;
      font-size: 28px;
    }

    .nav-item.active {
      color: #636363;
    }

    @media (min-width: 421px) {
      body {
        background: #d6d6d6;
      }

      .mobile-container {
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.08);
      }
    }

    @media (max-width: 350px) {
      .student-info {
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 10px;
        padding-inline: 11px;
      }

      .student-photo-container,
      .student-photo {
        width: 72px;
      }

      .student-photo {
        height: 96px;
      }

      .numbers-section {
        min-height: 181px;
        padding-top: 43px;
      }
    }
  </style>
</head>
<body>
  <main class="mobile-container">
    <header class="top-bar" aria-label="شريط الأدوات">
      <img src="sys_logo.png" alt="شعار المنصة" class="sys-logo-img">

      <div class="top-icons" aria-label="أدوات المنصة">
        <button class="icon-circle" type="button" aria-label="القائمة المنسدلة">
          <i class="fas fa-caret-down" aria-hidden="true"></i>
        </button>
        <button class="icon-circle" type="button" aria-label="بحث">
          <i class="fas fa-search" aria-hidden="true"></i>
        </button>
        <button class="icon-circle" type="button" aria-label="الإشعارات">
          <i class="fas fa-bell" aria-hidden="true"></i>
          <span class="notification-badge" aria-label="9 إشعارات أو أكثر">9+</span>
        </button>
      </div>
    </header>

    <section class="download-banner" aria-label="تحميل التطبيق">
      <div class="download-text">
        <i class="fab fa-android" aria-hidden="true"></i>
        <span>حمل التطبيق الآن</span>
      </div>
      <button class="download-btn" type="button">أضغط هنا</button>
    </section>

    <section class="card-area">
      <article class="full-card-container" aria-label="البطاقة الرقمية">
        <div class="id-card">
          <div class="card-header-section">
            <img src="logo.jpg" alt="شعار المعهد" class="card-header-logo">
            <span class="card-header-text">إدارة ونظم المعلومات بالمصرية للعلوم والتكنولوجيا</span>
          </div>

          <div class="student-info">
            <div class="student-photo-container">
              <img src="personal-photo.jpg" alt="الصورة الشخصية للطالب" class="student-photo">
              <div class="academic-year">2025-2026</div>
            </div>

            <div class="text-info">
              <div class="student-name">اسلام خالد عبدالله محمد</div>
              <div class="student-details">23-0221916559<br>نظم معلومات، فرقة ثالثة</div>
            </div>
          </div>

          <div class="numbers-section">
            <div class="id-number">ID: 30304122402219</div>
            <div class="live-date" id="dateDisplay" aria-label="التاريخ الحالي"></div>
            <div class="live-time" id="timeDisplay" aria-label="الوقت الحالي"></div>
          </div>

        </div>
      </article>
    </section>

    <nav class="bottom-nav" aria-label="التنقل السفلي">
      <button class="nav-item active" type="button" aria-label="الرئيسية">
        <i class="fas fa-home" aria-hidden="true"></i>
      </button>
      <button class="nav-item" type="button" aria-label="المستخدمون">
        <i class="fas fa-users" aria-hidden="true"></i>
      </button>
      <button class="nav-item" type="button" aria-label="التنبيهات">
        <i class="fas fa-bell" aria-hidden="true"></i>
      </button>
      <button class="nav-item" type="button" aria-label="القائمة">
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
    </nav>
  </main>

  <script>
    function getCairoDateParts() {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Africa/Cairo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(new Date());

      return parts.reduce(function (result, part) {
        if (part.type !== "literal") {
          result[part.type] = part.value;
        }
        return result;
      }, {});
    }

    function updateClock() {
      const date = getCairoDateParts();
      document.getElementById("dateDisplay").textContent = date.year + "-" + date.month + "-" + date.day;
      document.getElementById("timeDisplay").textContent = date.hour + ":" + date.minute + ":" + date.second;
    }

    updateClock();
    window.setInterval(updateClock, 1000);
  </script>
</body>
</html>
